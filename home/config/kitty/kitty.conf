# Set size
initial_window_width  80c
initial_window_height 40c
remember_window_size yes

# Window background transparency (1.0 = opaque, 0.0 = fully see-through)
background_opacity 0.85

# Keep window decorations/borders unaffected by the opacity (optional, usually looks better)
dynamic_background_opacity yes

# Mouse
copy_on_select    yes

scrollback_lines 10000

window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

tab_bar_style     powerline
tab_powerline_style slanted
tab_bar_edge      top

enable_audio_bell no
visual_bell_duration 0

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11.0

# Cursor
cursor_shape     block
cursor_blink_interval 0.5

map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_tab
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0


# To browse and select a kitty theme, enter:
#   kitty +kitten themes
# Or to specify a kitty theme, enter:
#   kitty +kitten themes Default

# BEGIN_KITTY_THEME
# Eldritch dark
include current-theme.conf
# END_KITTY_THEME

# Based on https://github.com/andrea-rosa/conky-config/ ; run via: conky -c /path/to/conky.conf

conky.config = {
	background = true,
	update_interval = 1.5,
	cpu_avg_samples = 2,
	net_avg_samples = 2,
	out_to_console = false,
	override_utf8_locale = true,
	double_buffer = true,
	no_buffers = true,
	text_buffer_size = 32768,
	imlib_cache_size = 0,
	own_window = true,
	own_window_type = 'desktop',
	own_window_argb_visual = true,
	own_window_argb_value = 120,
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	border_inner_margin = 10,
	border_outer_margin = 0,
	xinerama_head = 2,
	alignment = 'top_right',
	gap_x = 30,
	gap_y = 150,
	draw_shades = true,
	draw_outline = false,
	draw_borders = false,
	draw_graph_borders = false,
	use_xft = true,
	font = 'Ubuntu Mono:size=11',
	xftalpha = 0.8,
	uppercase = false,
	default_color = '#FFFFFF',
	own_window_colour = '#000000',
	minimum_width = 0, minimum_height = 0,
};

conky.text = [[
	${color #8DDA80}${sysname}${color} ${goto 230}${time %H:%M:%S} ${goto 320}${time %m/%d/%Y}
	${goto 20}${color #808080}Kernel ${kernel}${goto 230}Uptime ${uptime} ${color}
	${hr}
	${font}NET${font}${voffset -2} eno1 ${addrs eno1}
	${goto 20}${upspeedgraph eno1 30,178 06E9F8 2104FA}${goto 202}${downspeedgraph eno1 30,175 FFFF00 DD3A21}
	${goto 20}Up ${upspeed eno1}${goto 202}Down ${downspeed eno1}
	${hr}
	${font}DISK${font}${voffset -2}
	${goto 20}${diskiograph_read 30,178 06E9F8 2104FA}${goto 202}${diskiograph_write 30,175 FFFF00 DD3A21}
	${goto 20}Read ${diskio_read}${goto 202}Write ${diskio_write}
	${hr}
	${font}MEM${font}${voffset -2} ${mem}/${memmax} (${memperc}%) | Swap: ${swapperc}%
	${goto 20}${memgraph 30,375 AAF5D0 00B35B}
	${hr}
	${goto 20}CPU0: ${cpu cpu0}%${goto 100}${cpubar 7,80 cpu0}${goto 232}CPU4: ${cpu cpu4}%${goto 312}${cpubar 7,80 cpu4}
	${goto 20}CPU1: ${cpu cpu1}%${goto 100}${cpubar 7,80 cpu1}${goto 232}CPU5: ${cpu cpu5}%${goto 312}${cpubar 7,80 cpu5}
	${goto 20}CPU2: ${cpu cpu2}%${goto 100}${cpubar 7,80 cpu2}${goto 232}CPU6: ${cpu cpu6}%${goto 312}${cpubar 7,80 cpu6}
	${goto 20}CPU3: ${cpu cpu3}%${goto 100}${cpubar 7,80 cpu3}${goto 232}CPU7: ${cpu cpu7}%${goto 312}${cpubar 7,80 cpu7}
	${hr}
	${color #FFFF00}${goto 20}Process ${goto 270}Pid${goto 310}Cpu%${goto 365}Mem%${color}
	${goto 20}${top name 1} ${goto 240}${top pid 1}${goto 295}${top cpu 1}${goto 350}${top mem 1}
	${goto 20}${top name 2} ${goto 240}${top pid 2}${goto 295}${top cpu 2}${goto 350}${top mem 2}
	${goto 20}${top name 3} ${goto 240}${top pid 3}${goto 295}${top cpu 3}${goto 350}${top mem 3}
	${goto 20}${top name 4} ${goto 240}${top pid 4}${goto 295}${top cpu 4}${goto 350}${top mem 4}
	${goto 20}${top name 5} ${goto 240}${top pid 5}${goto 295}${top cpu 5}${goto 350}${top mem 5}
	${goto 20}${top name 6} ${goto 240}${top pid 6}${goto 295}${top cpu 6}${goto 350}${top mem 6}

]];

